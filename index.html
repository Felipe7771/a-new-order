<script>


async function carregarCatalog() {
    const resposta = await fetch('json/catalog.json');
    const catalog = await resposta.json();

    return catalog;
}


/* ============================================================
   CONFIG — mude aqui pra mudar a forma do jogo. O DOM inteiro
   é gerado a partir disso, então alterar esses números já
   reorganiza o tabuleiro/reserva sem tocar em mais nada.
============================================================ */
const CONFIG = {
  corridors: 4,      // corredores (linhas) do tabuleiro
  slotsPerSide: 3,    // slots de cada lado, por corredor
  reserveSize: 12,    // tamanho visual da mão
  playerName: null,   // preenchido pelo Menu quando a partida começa
  enemyName: null,
  // 'owner' | 'guest' — preenchido pelo Menu quando a partida começa.
  // Define TANTO o espelhamento visual do tabuleiro (cada jogador
  // sempre vê o próprio lado à esquerda) QUANTO quais colunas o
  // jogador local tem permissão de jogar (ver isMyColumn()).
  myRole: 'owner',
};

// Colunas 0..slotsPerSide-1 são sempre do OWER (regra do jogo/Firestore,
// ver matchmaking.js). Colunas slotsPerSide..2*slotsPerSide-1 são
// sempre do GUEST. Isso não muda com o ponto de vista — o que muda é
// só a ORDEM em que a gente desenha essas colunas na tela (ver
// Board.build/displayColOf).
function isOwnerColumn(col) {
  return col < CONFIG.slotsPerSide;
}

// A coluna pertence ao jogador LOCAL (baseado no papel dele na sala)?
function isMyColumn(col) {
  return CONFIG.myRole === 'guest' ? !isOwnerColumn(col) : isOwnerColumn(col);
}

/* ============================================================
   ESTADO — a "fonte da verdade". Tudo que é desenhado na tela
   vem daqui. É nisso que o Firebase vai escrever/ler no futuro:
   um onSnapshot substitui esses arrays e chama renderAll().

   board[row][col]:
     col 0..slotsPerSide-1        -> lado esquerdo (0 = borda, cresce em direção ao meio)
     col slotsPerSide..2*sPS-1    -> lado direito   (cresce em direção à borda)
     null = slot vazio

   reserves.ally  -> mão do jogador local (renderizada)
   reserves.enemy -> mão do oponente (só dado, sem DOM — o jogo
                     ainda não deve revelar a mão do inimigo)
============================================================ */
const state = {
  board: Array.from({ length: CONFIG.corridors }, () =>
    Array(CONFIG.slotsPerSide * 2).fill(null)
  ),
  reserves: {
    ally: Array(CONFIG.reserveSize).fill(null),
    enemy: Array(CONFIG.reserveSize).fill(null),
  },
  // Mobs = quantos bonecos o jogador pode mover no turno. A lógica
  // ainda não existe — por enquanto é só um número pra PlayerStats
  // ter o que mostrar; entra de verdade junto com o sistema de turno.
  mobs: {
    ally: 0,
    enemy: 0,
  },
  effects: {},
  winner: ''
};

// Fábrica simples pra manter os personagens com o mesmo formato
// em todo lugar (seed local hoje, documento do Firestore amanhã).
function createCharacter({ id, name, image, life, attack, rage, guard, owner = 'ally' }) {
  return { id, name, image, life, attack, rage, guard, owner };
}

function characterFromRoomData(d, ownerRole) {
  if (!d) return null;
  return createCharacter({
    id: d.id,
    name: d.name,
    image: '🗡️',
    life: d.life,
    attack: d.damage,
    rage: d.rage,
    guard: d.guard,
    owner: ownerRole,
  });
}

function getRandomKeyDoll() {
  const keys_doll = Object.keys(catalog);

  // Pega uma chave aleatória
  return keys_doll[Math.floor(Math.random() * keys_doll.length)];
}

function getRandomDoll() {
  const key_doll = getRandomKeyDoll();
  return {id: key_doll, doll: catalog[key_doll]};
}

/* ============================================================
   CardRenderer — desenha UM cartão dentro de um slot qualquer.
   Board e Reserve chamam essa mesma função; a única diferença
   entre os dois é a opção showStats/draggable.
============================================================ */
const CardRenderer = {
  render(el, character, { showStats = false, draggable = false } = {}) {
    el.innerHTML = '';
    el.classList.toggle('slot--empty', !character);
    el.classList.toggle('slot--filled', !!character);
    el.draggable = false;
    el.removeAttribute('aria-label');

    if (!character) {
      el.setAttribute('aria-label', 'Slot vazio');
      return;
    }

    const visual = document.createElement('div');
    visual.className = 'card-visual';
    visual.appendChild(this.createImage(character));
    el.appendChild(visual);

    if (showStats) {
      const stats = document.createElement('div');
      stats.className = 'card-stats';
      stats.innerHTML =
        `<span class="stat ${definyStyle('life',character.id)}${character.life}</span>` +
        `<span class="stat ${definyStyle('attack',character.id)}${character.attack}</span>` +
        (character.rage > 0? `<span class="stat stat--rage">${simbol.rage}${character.rage}</span>`: '');

      el.appendChild(stats);
    }

    if (draggable) el.draggable = true;
    el.setAttribute('aria-label', character.name);
  },

  // character.image pode ser uma URL de gif (produção) ou um
  // emoji/placeholder (o que a gente usa aqui pra não depender
  // de assets externos). A detecção é só "parece uma URL?".
  createImage(character) {
    const looksLikeUrl = /^https?:\/\//.test(character.image) || character.image.includes('/');
    if (looksLikeUrl) {
      const img = document.createElement('img');
      img.src = character.image;
      img.alt = character.name;
      img.className = 'card-img';
      return img;
    }
    const span = document.createElement('span');
    span.className = 'card-icon';
    span.textContent = character.image;
    return span;
  },
};

/* ============================================================
   Board — constrói e mantém o tabuleiro.
   setSlot()/clearSlot() são o jeito "certo" de mexer na matriz
   porque já cuidam do re-render. Mas nada impede de mexer direto
   em state.board e chamar renderSlot()/renderAll() depois (é
   assim que uma sincronização do Firebase vai funcionar).
============================================================ */
const Board = {
  slotEls: [],

  // Coluna LÓGICA (a mesma pra sempre, é o índice usado em
  // state.board / no documento do Firestore) -> coluna de EXIBIÇÃO
  // (onde ela realmente aparece na tela). Pro ower não muda nada.
  // Pro guest, espelha a fileira inteira (borda continua borda, meio
  // continua meio, só troca de lado) — assim o próprio lado do guest
  // sempre cai na esquerda, igual acontece pro ower.
  displayColOf(col) {
    const totalCols = CONFIG.slotsPerSide * 2;
    return CONFIG.myRole === 'guest' ? (totalCols - 1 - col) : col;
  },

  build(container) {
    container.innerHTML = '';
    this.slotEls = [];

    const totalCols = CONFIG.slotsPerSide * 2;
    // Ordem de construção dos slots: sempre em ordem crescente de
    // coluna de EXIBIÇÃO (não de coluna lógica), pra que o append
    // no DOM já saia na posição visual correta da esquerda pra
    // direita, sem precisar de CSS extra pra reordenar.
    const colsByDisplayOrder = Array.from({ length: totalCols }, (_, c) => c)
      .sort((a, b) => this.displayColOf(a) - this.displayColOf(b));

    for (let row = 0; row < CONFIG.corridors; row++) {
      const corridorEl = document.createElement('div');
      corridorEl.className = 'corridor';

      const leftEl = document.createElement('div');
      leftEl.className = 'corridor-side corridor-side--left';
      const rightEl = document.createElement('div');
      rightEl.className = 'corridor-side corridor-side--right';
      const gapEl = document.createElement('div');
      gapEl.className = 'corridor-gap';

      const rowSlots = new Array(totalCols);

      for (const col of colsByDisplayOrder) {
        const slotEl = document.createElement('div');
        slotEl.className = 'slot board-slot';
        slotEl.dataset.row = row;
        slotEl.dataset.col = col; // coluna LÓGICA — é o que DragDrop/state usam
        slotEl.tabIndex = 0;
        slotEl.setAttribute('role', 'button');
        if (!isMyColumn(col)) slotEl.classList.add('board-slot--enemy');

        DragDrop.attachDropTarget(slotEl);
        slotEl.addEventListener('click', () => this.handleSlotClick(row, col));
        slotEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') this.handleSlotClick(row, col);
        });

        const displayCol = this.displayColOf(col);
        (displayCol < CONFIG.slotsPerSide ? leftEl : rightEl).appendChild(slotEl);
        rowSlots[col] = slotEl;
      }

      corridorEl.append(leftEl, gapEl, rightEl);
      container.appendChild(corridorEl);
      this.slotEls.push(rowSlots);
    }
  },

  renderAll() {
    state.board.forEach((row, r) => row.forEach((_, c) => this.renderSlot(r, c)));
  },

  renderSlot(row, col) {
    CardRenderer.render(this.slotEls[row][col], state.board[row][col], { showStats: true });
  },

  handleSlotClick(row, col) {
    const character = state.board[row][col];
    if (character) Modal.open(character);
  },

  setSlot(row, col, character) {
    state.board[row][col] = character;
    this.renderSlot(row, col);
  },

  clearSlot(row, col) {
    this.setSlot(row, col, null);
  },
};

/* ============================================================
   Reserve — mesma lógica do Board, só que numa fileira única.
   Só a reserva "ally" ganha DOM; "enemy" fica só no estado.
============================================================ */
const Reserve = {
  slotEls: [],

  build(container) {
    container.innerHTML = '';
    this.slotEls = [];

    for (let i = 0; i < CONFIG.reserveSize; i++) {
      const slotEl = document.createElement('div');
      slotEl.className = 'slot reserve-slot';
      slotEl.dataset.index = i;
      slotEl.tabIndex = 0;
      slotEl.setAttribute('role', 'button');
      slotEl.dataset.sfxHover = 'hover';
      slotEl.dataset.sfxClick = 'click';

      DragDrop.attachDragSource(slotEl, i);
      slotEl.addEventListener('click', () => this.handleClick(i));
      slotEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') this.handleClick(i);
      });

      container.appendChild(slotEl);
      this.slotEls.push(slotEl);
    }
  },

  renderAll() {
    state.reserves.ally.forEach((_, i) => this.renderSlot(i));
  },

  renderSlot(i) {
    const character = state.reserves.ally[i];
    CardRenderer.render(this.slotEls[i], character, {
      showStats: false,
      draggable: !!character,
    });
  },

  handleClick(i) {
    const character = state.reserves.ally[i];
    if (character) Modal.open(character);
  },

  setSlot(i, character) {
    state.reserves.ally[i] = character;
    this.renderSlot(i);
    PlayerStats.update();
  },

  clearSlot(i) {
    this.setSlot(i, null);
  },
};

/* ============================================================
   DragDrop — arrastar da reserva pra um slot vazio do tabuleiro.
   Usa a API nativa de drag&drop, sem libs.
============================================================ */
const DragDrop = {
  attachDragSource(el, reserveIndex) {
    el.addEventListener('dragstart', (e) => {
      const character = state.reserves.ally[reserveIndex];
      if (!character) { e.preventDefault(); return; }
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', JSON.stringify({ reserveIndex }));
    });
  },

  attachDropTarget(el) {
    const row = () => Number(el.dataset.row);
    const col = () => Number(el.dataset.col);
    // slot vazio E dentro do próprio campo — as duas condições que
    // precisam valer pra soltar um boneco aqui.
    const canDropHere = () => state.board[row()][col()] === null && isMyColumn(col());

    el.addEventListener('dragover', (e) => {
      if (canDropHere()) {
        e.preventDefault();
        el.classList.add('slot--dragover');
      }
      // Se não pode soltar aqui, NÃO chama preventDefault() — isso faz
      // o navegador mostrar o cursor de "não permitido" sozinho, sem
      // precisar de CSS/JS extra pra isso.
    });

    el.addEventListener('dragleave', () => el.classList.remove('slot--dragover'));

    el.addEventListener('drop', (e) => {
      e.preventDefault();
      el.classList.remove('slot--dragover');
      if (!canDropHere()) return; // reforça a checagem (o campo inimigo nunca entra aqui)

      let payload;
      try { payload = JSON.parse(e.dataTransfer.getData('text/plain')); }
      catch { return; }

      const character = state.reserves.ally[payload.reserveIndex];
      if (!character) return;

      // Não mexe em state.board/state.reserves aqui — quem manda agora
      // é o Firestore. O onSnapshot (Game.syncRoom) redesenha tudo pros
      // dois lados quando a confirmação da escrita voltar.
      window.Game.placeDoll(row(), col(), payload.reserveIndex);
    });
  },
};

/* ============================================================
   PlayerNames — só escreve o texto nos dois cantos do topo.
   setNames() é o jeito de trocar depois (ex: quando o Firebase
   informar o nome real do oponente).
============================================================ */
const PlayerNames = {
  allyEl: null,
  enemyEl: null,

  init(allyEl, enemyEl) {
    this.allyEl = allyEl;
    this.enemyEl = enemyEl;
    this.setNames(CONFIG.playerName, CONFIG.enemyName);
  },

  setNames(playerName, enemyName) {
    if (playerName != null) this.allyEl.textContent = playerName;
    if (enemyName != null) this.enemyEl.textContent = enemyName;
  },
};

/* ============================================================
   PlayerStats — as duas linhas embaixo do nome de cada jogador:
   quantos bonecos ele tem na reserva, e quantos MOBS ele tem
   (mobs = quantos bonecos dá pra mover no turno; a contagem real
   ainda não existe, isso só desenha o número de state.mobs).
   update() é chamado sempre que a reserva ou os mobs mudam.
============================================================ */
const PlayerStats = {
  els: {},

  init(dollsAllyEl, mobsAllyEl, dollsEnemyEl, mobsEnemyEl) {
    this.els = {
      dollsAlly: dollsAllyEl,
      mobsAlly: mobsAllyEl,
      dollsEnemy: dollsEnemyEl,
      mobsEnemy: mobsEnemyEl,
    };
    this.update();
  },

  countDolls(reserve) {
    return reserve.filter(Boolean).length;
  },

  update() {
    if (!this.els.dollsAlly) return;
    this.els.dollsAlly.innerHTML = `x${this.countDolls(state.reserves.ally)}<i class="bi bi-people-fill"></i>`;
    this.els.dollsEnemy.innerHTML = `x${this.countDolls(state.reserves.enemy)}<i class="bi bi-people-fill"></i> `;
    this.els.mobsAlly.innerHTML = `x${state.mobs.ally} MOBS`;
    this.els.mobsEnemy.innerHTML = `x${state.mobs.enemy} MOBS`;
  },
};

/* ============================================================
   EntranceFX — telão de entrada quando um boneco pisa no tabuleiro.
   Nome grande em vermelho, grupo pequeno embaixo, e (se o boneco
   tiver poder) a descrição em branco. Toca audio/entrance/{grupo}.mp3
   e some sozinho depois de um tempo — é só um flash informativo.
============================================================ */
const EntranceFX = {
  el: null,
  hideTimeout: null,

  init(el) {
    this.el = el;
  },

  show(character, row, col) {
    if (!this.el) return;
    const doll = catalog[character.id];
    if (!doll) return;

    clearTimeout(this.hideTimeout);

    // IMPORTANTE: usa a coluna de EXIBIÇÃO (pós-espelhamento pro
    // guest), não a coluna lógica — senão o texto de entrada nasce
    // do lado errado da tela pro jogador convidado.
    const isLeftSide = Board.displayColOf(col) < CONFIG.slotsPerSide;
    this.el.classList.toggle('entrance-overlay--from-left', isLeftSide);
    this.el.classList.toggle('entrance-overlay--from-right', !isLeftSide);

    // Posiciona o texto grudado no slot: se o boneco caiu do lado
    // esquerdo do corredor, o texto nasce à direita do slot (e vice-
    // versa), pra nunca ficar cortado pela borda do tabuleiro.
    const slotEl = Board.slotEls[row]?.[col];
    if (slotEl) {
      const rect = slotEl.getBoundingClientRect();
      const top = rect.top + rect.height / 2;
      this.el.style.top = `${top}px`;
      this.el.style.left = isLeftSide ? `${rect.right}px` : `${rect.left}px`;
    }

    this.el.innerHTML = `
      <div class="entrance-card">
        <h2 class="entrance-name">${character.name}</h2>
        <p class="entrance-group">${doll.group}</p>
        ${doll.power?.has
          ? `<p class="entrance-power">${doll.power.description.replace('[', '<i><strong><u>').replace(']', '</u></strong></i>')}</p>`
          : ''}
      </div>
    `;

    // reinicia a animação (senão dois disparos seguidos ficam parados)
    this.el.classList.remove('entrance-overlay--visible');
    void this.el.offsetWidth; // força reflow
    this.el.classList.add('entrance-overlay--visible');

    AudioManager.Sfx.entrance(doll.group);

    this.hideTimeout = setTimeout(() => {
      this.el.classList.remove('entrance-overlay--visible');
    }, 3200);
  },
};

/* ============================================================
Modal — janela simples com as infos do personagem.
============================================================ */

const Modal = {
  el: null,

  init(el) {
    this.el = el;
    el.addEventListener('click', (e) => {
      if (e.target === el) this.close();
    });
  },

  open(character) {
    const doll = catalog[character.id]
    const attbts = joinAttributes(doll.attbtLife, doll.attbtDamage)

    this.el.innerHTML = `
      <div class="modal-card">
        <button class="modal-close" data-sfx-click="click" aria-label="Fechar">&#10005;</button>
        <div class="modal-visual"></div>
        <h2 class="modal-name">${character.name}</h2>
        <h2 class="modal-group"><i>${doll.group}<i></h2>
          <div class="modal-stats">
            <span class="stat ${definyStyle('life',character.id)}Vida: ${character.life}</span>
              <span class="stat ${definyStyle('attack',character.id)}Ataque: ${character.attack}</span>
          </div>
          ${attbts.length || doll.power.description !== '' ? "<hr style='opacity: 0.3;'>": ''}
          <h2 class="modal-attributes">${getHTMLattributes(attbts,doll.rageDamage)}</h2>
          <br>
          <h2 class="modal-power">${doll.power.description.replace('[','<i><strong><u>').replace(']','</i></strong></u>')}</h2>

          ${doll.affinities.length ? "<br><hr style='opacity: 0.3;'>": ''}

          <h2 class="modal-affinities">${doll.affinities.map(item => `&#9903;${item}   `).join('')}</h2>
      </div>
    `;
    this.el.querySelector('.modal-visual').appendChild(CardRenderer.createImage(character));
    this.el.querySelector('.modal-close').addEventListener('click', () => this.close());
    this.el.classList.add('modal-overlay--visible');

    // Prévia sonora do atributo principal do boneco (rage, drill, guardian...).
    // Quando o sistema de combate real existir, chame AudioManager.Sfx.dollEffect()
    // no momento do golpe de verdade — isso aqui é só a ficha sendo aberta.
    AudioManager.Sfx.dollEffect(attbts[0] || 'default');
  },

  close() {
    this.el.classList.remove('modal-overlay--visible');
  },

};

   Dados de exemplo — só pra provar que o sistema funciona.

  return createCharacter({ id, name: doll.name,  image: '🗡️', life: doll.stats.baseLife, attack: doll.stats.baseDamage, rage: doll.rageDamage, guard: new Set(doll.attbtLife).has('guardian')})
}

// Carrega o catálogo assim que a página abre — precisa estar
// pronto ANTES da partida começar, porque o Modal e o styles.js
// (definyStyle) consultam a variável global `catalog`.
async function boot() {
  catalog = await carregarCatalog();
}

/* ============================================================
   Boot
============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  Board.build(document.getElementById('board'));
  Reserve.build(document.getElementById('reserve-ally'));
  Modal.init(document.getElementById('modal-overlay'));
  EntranceFX.init(document.getElementById('entrance-overlay'));
  PlayerNames.init(
    document.getElementById('player-name-ally'),
    document.getElementById('player-name-enemy')
  );
  PlayerStats.init(
    document.getElementById('player-dolls-ally'),
    document.getElementById('player-mobs-ally'),
    document.getElementById('player-dolls-enemy'),
    document.getElementById('player-mobs-enemy')
  );

  boot();

  // ---- Áudio: liga tudo de uma vez, aqui no boot ----------------
  // bindUISounds cobre qualquer elemento com data-sfx-click/hover,
  // inclusive os criados depois (slots, botão de fechar modal).
  AudioManager.bindUISounds();
  AudioManager.attachTypingSound(document.getElementById('input-username'));
  // Autoplay do navegador só libera som após um gesto do usuário —
  // isso dispara a música do menu no primeiro clique/tecla.
  AudioManager.primeOnFirstInteraction('menu');

  // Botões acima da Reserva — a lógica de fato (confirmar rendição,
  // abrir painel de configurações) entra aqui quando existir.
  document.getElementById('btn-surrender').addEventListener('click', () => {
    console.log('[Trincheira] Render-se clicado — plugar lógica de rendição aqui.');
  });
  document.getElementById('btn-settings').addEventListener('click', () => {
    console.log('[Trincheira] Configurações clicado — plugar painel de configurações aqui.');
  });

  // API pública — é aqui que a integração com Firebase entra depois.
  // Ex.: onSnapshot(docRef, (doc) => Game.loadBoardState(doc.data().board))
window.Game = {
  CONFIG,
  state,
  Board,
  Reserve,
  Modal,
  PlayerNames,
  PlayerStats,
  roomId: null,
  meId: null,
  opponentId: null,
    loadBoardState(newBoard) {
      state.board = newBoard;
      Board.renderAll();
    },
    loadAllyReserveState(newReserve) {
      state.reserves.ally = newReserve;
      Reserve.renderAll();
    },
    setPlayerNames(playerName, enemyName) {
      PlayerNames.setNames(playerName, enemyName);
    },

    // Chamado pelo js/menu.js quando o Firestore fecha uma sala
    // (dono + convidado presentes, 12 bonecos já sorteados pros
    // dois lados). Só desenha o que já veio pronto — nenhuma
    // lógica de turno/combate mexe aqui ainda.
  startMatch({ roomId, me, opponent, myReserve, opponentReserve, role }) {
    this.roomId = roomId;
    this.meId = me.id;
    this.opponentId = opponent.id;

    // 'owner' | 'guest' — decide o espelhamento do tabuleiro e o
    // bloqueio de colocar boneco no campo inimigo (ver CONFIG.myRole
    // em isMyColumn/Board.displayColOf). Precisa ser setado ANTES de
    // reconstruir o board, senão ele nasce com a orientação errada.
    CONFIG.myRole = role === 'guest' ? 'guest' : 'owner';

    CONFIG.playerName = me.name;
    CONFIG.enemyName = opponent.name;
    PlayerNames.setNames(me.name, opponent.name);

    state.reserves.ally = myReserve.map((d) => characterFromRoomData(d, 'ally'));
    state.reserves.enemy = opponentReserve.map((d) => characterFromRoomData(d, 'enemy'));

    // Reconstrói o tabuleiro agora que já sabemos o papel do jogador
    // local — o build feito no boot (DOMContentLoaded) usava o valor
    // padrão 'owner' porque a sala ainda não tinha fechado.
    Board.build(document.getElementById('board'));

    Reserve.renderAll();
    Board.renderAll();
    PlayerStats.update();

    AudioManager.enterBoard();
    document.getElementById('app').classList.remove('pre-match');
  },

  // Chamado a cada onSnapshot depois que a partida começou.
  // Reconstrói tabuleiro + reservas a partir do documento da sala
  // e dispara EntranceFX pra qualquer slot que passou de vazio pra
  // ocupado (seja boneco meu ou do oponente).
  syncRoom(data) {
    if (!this.meId) return;

    const newBoard = Array.from({ length: CONFIG.corridors }, () =>
      Array(CONFIG.slotsPerSide * 2).fill(null)
    );

    const boardData = data.board || {};
    Object.entries(boardData).forEach(([key, dollData]) => {
      if (!dollData) return;
      const [r, c] = key.split('-').map(Number);
      if (Number.isNaN(r) || Number.isNaN(c)) return;
      const ownerRole = dollData.owner === this.meId ? 'ally' : 'enemy';
      newBoard[r][c] = characterFromRoomData(dollData, ownerRole);
    });

    for (let r = 0; r < CONFIG.corridors; r++) {
      for (let c = 0; c < CONFIG.slotsPerSide * 2; c++) {
        if (!state.board[r][c] && newBoard[r][c]) {
          EntranceFX.show(newBoard[r][c], r, c);
        }
      }
    }

    state.board = newBoard;
    Board.renderAll();

    const myReserveData = data.p?.[this.meId]?.reserve || [];
    const oppReserveData = data.p?.[this.opponentId]?.reserve || [];

    state.reserves.ally = myReserveData.map((d) => characterFromRoomData(d, 'ally'));
    state.reserves.enemy = oppReserveData.map((d) => characterFromRoomData(d, 'enemy'));

    Reserve.renderAll();
    PlayerStats.update();
  },

  async placeDoll(row, col, reserveIndex) {
    if (!this.roomId || !this.meId) {
      console.warn('[Trincheira] placeDoll chamado sem partida ativa.');
      return;
    }
    try {
      await window.Matchmaking.placeDoll(this.roomId, this.meId, reserveIndex, row, col);
    } catch (err) {
      console.error('[Trincheira] não foi possível jogar o boneco:', err);
    }
  },

    // Atalho pra testar a tela do jogo sem precisar do Firebase
    // configurado — abra o console e rode: Game.seedDemo()
    async seedDemo() {
      if (!catalog) catalog = await carregarCatalog();
      seedDemoData();
      Reserve.renderAll();
      Board.renderAll();
      PlayerStats.update();

      /* ══════════════════════════════════════════════════════════
         ██  TRANSIÇÃO: MENU  ➜  TABULEIRO  ██  (atalho de teste)
         Mesmo ponto de troca de música do startMatch() de verdade.
      ══════════════════════════════════════════════════════════ */
      AudioManager.enterBoard();

      document.getElementById('app').classList.remove('pre-match');
      document.getElementById('menu-screen').classList.add('menu-screen--hidden');
    },
  };
});
</script>
