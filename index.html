        <span class="player-stat player-stat--mobs" id="player-mobs-ally">x0 MOBS</span>
      </div>
    </div>

<div class="turn-action" id="turn-action">
<div class="turn-clock" id="turn-clock">
  <div class="turn-clock__bezel"></div>
  <div class="turn-clock__dial" id="turn-clock-dial"></div>

  <div class="turn-clock__ticks" aria-hidden="true">
    <span class="turn-clock__tick turn-clock__tick--major" style="--i:0"></span>
    <span class="turn-clock__tick" style="--i:1"></span>
    <span class="turn-clock__tick" style="--i:2"></span>
    <span class="turn-clock__tick turn-clock__tick--major" style="--i:3"></span>
    <span class="turn-clock__tick" style="--i:4"></span>
    <span class="turn-clock__tick" style="--i:5"></span>
    <span class="turn-clock__tick turn-clock__tick--major" style="--i:6"></span>
    <span class="turn-clock__tick" style="--i:7"></span>
    <span class="turn-clock__tick" style="--i:8"></span>
    <span class="turn-clock__tick turn-clock__tick--major" style="--i:9"></span>
    <span class="turn-clock__tick" style="--i:10"></span>
    <span class="turn-clock__tick" style="--i:11"></span>
  </div>

  <div class="turn-clock__hand turn-clock__hand--hour" aria-hidden="true"></div>
  <div class="turn-clock__hand turn-clock__hand--minute" id="turn-clock-minute" aria-hidden="true"></div>
  <div class="turn-clock__pin" aria-hidden="true"></div>

    <span style="--x:3%; --y:42%"></span>
    <span style="--x:19%; --y:13%"></span>
  </div>
</div>
  <p class="turn-clock__hint" id="turn-clock-hint">Realize sua estratégia</p>
  <button id="btn-end-turn" class="end-turn-btn" type="button" disabled
    data-sfx-click="click" data-sfx-hover="hover">
    <i class="bi bi-anchor end-turn-btn__anchor" aria-hidden="true"></i>
    <span class="end-turn-btn__label">Encerrar Turno</span>
    <i class="bi bi-anchor end-turn-btn__anchor" aria-hidden="true"></i>
  </button>
</div>

    <div class="player-info player-info--enemy">

    </div>

  </div>

        <button id="btn-settings" class="reserve-action-btn" type="button" title="Configurações" aria-label="Configurações" data-sfx-click="click" data-sfx-hover="hover">⚙️</button>
